# Configuración de Alembic para Job Matcher.
# La URL de la base de datos NO se define aquí: se resuelve en migrations/env.py
# a partir de settings.DATABASE_URL (variable de entorno DATABASE_URL).

[alembic]
script_location = migrations
prepend_sys_path = .
# Usa rutas relativas al directorio de configuración (backend/).
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
